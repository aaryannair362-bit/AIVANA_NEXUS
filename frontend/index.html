<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUS Manual Test</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f6f8fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1280px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}.brand h1{margin:0;font-size:28px}.brand p{margin:6px 0 0;color:#667085}.badge{font-size:12px;padding:7px 10px;border-radius:999px;background:#eef2ff;color:#3448a5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:white;border:1px solid #e4e7ec;border-radius:14px;padding:16px;box-shadow:0 1px 2px #1018280a}label{font-weight:700;display:block;margin-bottom:10px}textarea{width:100%;min-height:260px;resize:vertical;border:1px solid #d0d5dd;border-radius:10px;padding:13px;font:inherit;line-height:1.5;outline:none}textarea:focus{border-color:#667eea;box-shadow:0 0 0 3px #667eea18}.actions{display:flex;justify-content:center;margin:20px 0}.run{border:0;border-radius:10px;padding:13px 30px;background:#2737d8;color:white;font-weight:800;font-size:15px;cursor:pointer}.run:disabled{opacity:.5;cursor:wait}.status{margin-left:12px;color:#667085;align-self:center}.result{display:none}.result.show{display:block}.section{margin-top:18px}.section h2{font-size:19px;margin:0 0 12px}.kv{display:grid;grid-template-columns:240px 1fr;border-top:1px solid #eaecf0}.kv>div{padding:10px 8px;border-bottom:1px solid #eaecf0}.key{font-weight:700;color:#475467}.val{white-space:pre-wrap;word-break:break-word}.pill{display:inline-block;padding:5px 8px;border-radius:7px;background:#f2f4f7;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}.danger{background:#fff1f0;color:#b42318}.ok{background:#ecfdf3;color:#067647}.warn{background:#fffaeb;color:#b54708}.empty{color:#98a2b3}.json{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;background:#101828;color:#e6eaf2;border-radius:10px;padding:12px;max-height:360px;overflow:auto}.notice{padding:12px 14px;border-radius:10px;background:#fffaeb;border:1px solid #fedf89;color:#7a2e0e;margin-bottom:16px;display:none}@media(max-width:820px){.grid{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.key{padding-bottom:2px!important}.val{padding-top:2px!important}}
</style></head><body><div class="wrap"><div class="head"><div class="brand"><h1>NEXUS Manual Test</h1><p>History + current consultation → actual extraction → deterministic pathway engine</p></div><span class="badge">15 cancer packages only</span></div>
<div id="notice" class="notice"></div><div class="grid"><div class="card"><label for="history">PATIENT HISTORY / LONGITUDINAL SUMMARY</label><textarea id="history" placeholder="Paste longitudinal patient history here..."></textarea></div><div class="card"><label for="opd">CURRENT OPD / CONSULTATION NOTE</label><textarea id="opd" placeholder="Paste today's/current consultation note here..."></textarea></div></div>
<div class="actions"><button id="run" class="run">RUN NEXUS</button><span id="working" class="status"></span></div>
<div id="result" class="result"><div class="card section"><h2>A. Extraction understood</h2><div id="extract"></div></div><div class="card section"><h2>B–E. NEXUS deterministic result</h2><div id="nexus"></div></div><details class="card section"><summary><b>Raw response / audit trace</b></summary><pre id="raw" class="json"></pre></details></div></div>
<script>
const $=id=>document.getElementById(id); const pretty=v=>v==null||v===''?'—':typeof v==='string'?v:JSON.stringify(v,null,2);
const rows=(obj,labels)=>'<div>'+labels.map(([k,l])=>`<div class="kv"><div class="key">${l}</div><div class="val">${format(obj?.[k])}</div></div>`).join('')+'</div>';
function format(v){if(v==null||(Array.isArray(v)&&!v.length)||(typeof v==='object'&&!Array.isArray(v)&&!Object.keys(v).length))return '<span class="empty">None / not present</span>'; if(typeof v==='string'){let cls=v==='REQUIRES_REVIEW'?'danger':v==='NEEDS_INFORMATION'||v==='GUIDELINE_NOT_AVAILABLE'?'warn':v==='RECOMMENDATION'||v==='RESOLVED'?'ok':'';return `<span class="pill ${cls}">${escapeHtml(v)}</span>`}return `<pre style="margin:0;white-space:pre-wrap;font:12px ui-monospace,SFMono-Regular,Menlo,monospace">${escapeHtml(JSON.stringify(v,null,2))}</pre>`}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function health(){try{let r=await fetch('/api/health'),j=await r.json();if(j.status!=='ok'){let n=$('notice');n.style.display='block';n.textContent=j.message||'Deterministic engine not found.'}}catch{}}
$('run').onclick=async()=>{let btn=$('run');btn.disabled=true;$('working').textContent='Running extraction → longitudinal merge → deterministic engine…';$('result').classList.remove('show');try{let r=await fetch('/api/v1/nexus/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({patient_history:$('history').value,current_opd_note:$('opd').value})});let j=await r.json();$('extract').innerHTML=rows(j.extraction,[['detected_cancer','DETECTED CANCER'],['cancer_detection_status','CANCER DETECTION STATUS'],['provider','EXTRACTION PROVIDER'],['extraction_mode_warning','EXTRACTION MODE WARNING'],['provider_warnings','EXTRACTION PROVIDER WARNINGS'],['current_verified_facts','CURRENT VERIFIED FACTS'],['current_pending_unverified_facts','CURRENT PENDING / UNVERIFIED FACTS'],['historical_facts','HISTORICAL FACTS'],['new_facts_from_today','NEW FACTS FROM TODAY'],['updated_facts','UPDATED FACTS'],['superseded_facts','SUPERSEDED FACTS'],['conflicting_facts','CONFLICTING FACTS'],['normalized_non_routing_facts','NORMALIZED NON-ROUTING CLINICAL FACTS'],['unresolved_clinical_mentions','UNRESOLVED CLINICAL MENTIONS'],['canonical_facts_sent_to_engine','CANONICAL FACTS SENT TO ENGINE']]);$('nexus').innerHTML=rows(j.nexus_result,[['status','Status'],['detected_cancer','Detected cancer'],['guideline','Guideline'],['guideline_version','Guideline/version'],['current_clinical_state','Current clinical state'],['current_nccn_pathway','Current NCCN pathway'],['current_pathway_node','Current pathway node'],['applicable_nccn_options','Applicable NCCN options'],['required_workup_information','Required work-up / information'],['missing_pathway_changing_facts','Missing pathway-changing facts'],['conflicting_information','Conflicting information'],['evidence_used','Evidence used'],['why_nexus_reached_this_pathway','Why NEXUS reached this pathway'],['what_could_change_the_pathway','What could change the pathway'],['source_page_section_references','Source page / section references'],['next_transition','Next transition']]);$('raw').textContent=JSON.stringify(j,null,2);$('result').classList.add('show')}catch(e){let n=$('notice');n.style.display='block';n.textContent='Run failed: '+e}finally{btn.disabled=false;$('working').textContent=''}}; health();
</script></body></html>
