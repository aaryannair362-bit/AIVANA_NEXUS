services:
  - type: web
    name: aivana-nexus
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn integration_api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: NEXUS_EXTRACTION_PROVIDER
        value: auto
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
